<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="940" viewBox="0 0 1400 940" role="img" aria-labelledby="title description">
<title id="title">Filing Fact-Checker architecture</title>
<desc id="description">Reviewer UI and CLI enter a LangGraph workflow with planning, evidence recall, an iterative Executor, validation, and structured reports. Local PDF search and evidence memory supply sources. Qwen runs locally through Ollama.</desc>

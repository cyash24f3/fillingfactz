[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filing-fact-checker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6,<1",
    "pydantic>=2,<3",
    "PyMuPDF>=1.24,<2",
    "langgraph>=1.2,<2",
    "typing-extensions>=4.12,<5",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
include = ["filing_checker*"]
namespaces = false
